version: '3.8'

services:

  # ======================================
  # SQL SERVER 2022
  # ======================================

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gms-sqlserver
    hostname: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Azerty12
      - MSSQL_PID=Express
      - MSSQL_TCP_PORT=1433
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - gms-network
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P GmsP@ssw0rd2024! -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ======================================
  # GMS APPLICATION (Build from source)
  # ======================================

  gms-desktop:
    build:
      context: .
      dockerfile: docker/Dockerfile.desktop
    container_name: gms-desktop-app
    depends_on:
      - sqlserver
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=GmsDb;User=sa;Password=Azerty12;TrustServerCertificate=True
    networks:
      - gms-network
    restart: unless-stopped
    volumes:
      - ./GMS-Desktop:/app
      - ./logs:/app/logs
      - ./backups:/app/backups
      
# ======================================
# VOLUMES PERSISTANTS
# ======================================

volumes:
  sqlserver-data:
    driver: local

# ======================================
# NETWORK
# ======================================

networks:
  gms-network:
    driver: bridge